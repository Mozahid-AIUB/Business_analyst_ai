# Local/staging stack: the API plus PostgreSQL.
#
#   cp .env.example .env
#   # set SECRET_KEY and POSTGRES_PASSWORD in .env, then:
#   docker compose up --build
#
# Both values are required - there are no defaults for them below, so compose
# fails fast rather than starting with a blank password.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-sentinel}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Not published to the host by default: the API reaches it over the
    # compose network. Uncomment only if you need psql from outside.
    # ports:
    #   - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sentinel} -d ${POSTGRES_DB:-sentinel}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    # service_healthy, not service_started: Postgres accepts TCP before it
    # accepts queries, so the weaker condition produces a startup race.
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env - generate with: openssl rand -hex 32}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-14}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-sentinel}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-sentinel}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}
    ports:
      - "8000:8000"

volumes:
  pgdata:

[pytest]
testpaths = tests
# Quieter output without hiding real problems; conftest.py adds the project
# root to sys.path so `app` imports without an editable install.
addopts = -q
filterwarnings =
    # Starlette's TestClient warns about httpx 1.x; the suite passes on it and
    # the alternative is an unreleased dependency.
    ignore::DeprecationWarning
    ignore::UserWarning
